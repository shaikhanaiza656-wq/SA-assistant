name: Android CI Build

# Runs on every push/PR to main, and can be triggered manually.
# Uses gradle/actions/setup-gradle to install Gradle 8.9 directly on the
# runner, so this workflow does NOT depend on gradle/wrapper/gradle-wrapper.jar
# being present in the repo (that binary is intentionally not committed —
# see README.md for why).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Grant execute permission to gradlew (fallback path)
        run: chmod +x ./gradlew || true

      - name: Lint
        run: gradle lint --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
